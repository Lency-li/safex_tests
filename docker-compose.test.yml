services:
  api:
    image: ghcr.io/gonfff/safex:latest
    environment:
      SAFEX_API_ADDR: ":8080"
      SAFEX_ENVIRONMENT: "${SAFEX_ENVIRONMENT:-test}"
      SAFEX_METADATA_BACKEND: "redis"
      SAFEX_REDIS_ADDR: "redis:6379"
      SAFEX_BLOB_BACKEND: "local"
      SAFEX_BLOB_DIR: "/tmp/blobs"
      SAFEX_DEFAULT_TTL_MINUTES: "${SAFEX_DEFAULT_TTL_MINUTES:-1}"
      SAFEX_RATE_LIMIT_PER_MINUTE: "${SAFEX_RATE_LIMIT_PER_MINUTE:-1000}"
      SAFEX_MAX_PAYLOAD_MB: "${SAFEX_MAX_PAYLOAD_MB:-10}"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_started
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8-alpine
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      api:
        condition: service_healthy
    environment:
      - BASE_URL=http://api:8080
      - API_BASE_URL=http://api:8080
      - HEADLESS=true
      - DEFAULT_TIMEOUT=10
      - LOG_LEVEL=INFO
    volumes:
      - ./allure-results:/app/allure-results  
      - ./logs:/app/logs
    networks:
      - test-network
    command: >
      sh -c "pytest tests/ -v --tb=short --alluredir=allure-results"

networks:
  test-network:
    driver: bridge