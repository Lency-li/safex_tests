[project]
name = "safex-tests"
version = "0.1.0"
description = "UI and API tests for Safex"
authors = [
    {name = "lency-li",email = "vladimir@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "selenium (>=4.41.0,<5.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "allure-pytest (>=2.15.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "faker (>=40.13.0,<41.0.0)"
]
